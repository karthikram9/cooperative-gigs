services:
  - type: web
    name: cooperative-gig-backend
    env: java
    plan: free
    buildCommand: chmod +x mvnw && ./mvnw clean package -DskipTests
    startCommand: java -jar target/cooperative-gig-backend-0.0.1-SNAPSHOT.jar
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Platform Admin
      - key: ADMIN_PHONE
        value: 9000000000
      - key: WELFARE_CONTRIBUTION_PERCENTAGE
        value: 5
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false