spring.application.name=cooperative-gig-backend
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cooperative_gig1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
$1${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
welfare.contribution-percentage=${WELFARE_CONTRIBUTION_PERCENTAGE:5}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.name=${ADMIN_NAME:Platform Admin}
app.admin.phone=${ADMIN_PHONE:9000000000}


spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
